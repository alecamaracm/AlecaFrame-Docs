# Hashed build assets are immutable; HTML and everything else must revalidate
map $uri $cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Declared once at server level; no location below uses add_header, so these are inherited everywhere
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # cleanUrls: /faq -> /faq.html
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
